[package]
name = "vuln02-account-substitution"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "vuln02_account_substitution"

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions"] }

# Required by `anchor build` for IDL generation
[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
